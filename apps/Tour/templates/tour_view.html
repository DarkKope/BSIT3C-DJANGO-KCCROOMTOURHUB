<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tour.title }} | ClassroomTourHub</title>
    <!-- Pannellum CSS for 360 Viewer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 0; overflow: hidden; }
        .navbar { background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 1050; position: relative; }
        #panorama {
            width: 100vw;
            height: calc(100vh - 56px); /* Full height minus navbar */
            background-color: #000;
        }
    </style>
</head>
<body>

    <!-- Floating Navbar -->
    <nav class="navbar navbar-dark py-2">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fs-6">
                <i class="fa-solid fa-vr-cardboard text-primary me-2"></i> 
                {{ tour.classroom.name }} <span class="text-secondary mx-2">/</span> {{ tour.title }}
            </span>
            <a href="/" class="btn btn-outline-light btn-sm rounded-pill">
                <i class="fa-solid fa-arrow-left me-1"></i> Exit Tour
            </a>
        </div>
    </nav>

    <!-- The 360 Viewer -->
    <div id="panorama"></div>

    <!-- Pannellum JS -->
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
        {% if scene %}
            pannellum.viewer('panorama', {
                "type": "equirectangular",
                "panorama": "{{ scene.image_url }}", 
                "autoLoad": true,
                "compass": true,
                "showControls": true,
                "orientationOnByDefault": true,
                "hfov": 100
            });
        {% else %}
            document.getElementById('panorama').innerHTML = "<div style='color:white; text-align:center; padding-top: 20vh;'><h3>No scenes added to this tour yet.</h3></div>";
        {% endif %}
    </script>
</body>
</html>
