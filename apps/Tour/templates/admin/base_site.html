{% extends "admin/base.html" %}
{% load static %}

{% block title %}KCC Admin{% endblock %}

{% block extrastyle %}
    {{ block.super }}
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'admin/css/custom_admin.css' %}?v=1000">
    
    <style>
        /* Global Reset & Dark Theme */
        body { background-color: #0A1F44 !important; color: #ffffff; margin: 0; padding: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Hide default Django UI */
        #header, #branding, #user-tools, .breadcrumbs, #nav-sidebar, .toggle-nav-sidebar { display: none !important; }
        
        /* Flex Layout */
        #container { display: flex !important; min-height: 100vh; padding: 0 !important; margin: 0 !important; width: 100vw !important; max-width: 100vw !important; background: transparent !important; }
        #content { flex-grow: 1; padding: 0 !important; margin: 0 !important; width: 100%; display: flex; flex-direction: column; }

        /* FIXED SIDEBAR */
        .custom-sidebar {
            width: 100px; background-color: #0A1F44;
            border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column;
            align-items: center; padding-top: 30px; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1000;
        }
        .sidebar-logo { font-size: 1.5rem; color: #F2A900; margin-bottom: 40px; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 15px; width: 100%; padding: 0 10px; }
        
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px 5px; border-radius: 12px; color: #E6F0FA; text-decoration: none;
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase; transition: 0.2s;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 5px; color: #E6F0FA; }
        .nav-item:hover, .nav-item.active { background-color: #F2A900; color: #0A1F44; }
        .nav-item:hover i, .nav-item.active i { color: #0A1F44; }
        
        .nav-item.logout { margin-top: 50px; color: #ff6b6b; }
        .nav-item.logout:hover { background-color: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .nav-item.logout i { color: #ff6b6b; }

        /* MAIN AREA */
        .main-layout { margin-left: 100px; width: calc(100vw - 100px); display: flex; flex-direction: column; min-height: 100vh; }
        
        /* TOP BAR */
        .top-bar { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); background: #0A1F44; }
        .logo-left { font-family: 'Oswald', sans-serif; font-size: 2rem; font-weight: 700; color: #F2A900; }
        
        /* CONTENT WRAPPER */
        .admin-content-wrapper { padding: 40px; flex-grow: 1; width: 100%; box-sizing: border-box; }
    </style>
{% endblock %}

{% block content %}
<div style="display: flex; width: 100vw; min-height: 100vh;">

    <!-- FIXED SIDEBAR -->
    <div class="custom-sidebar">
        <div class="sidebar-logo"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="sidebar-nav">
            <a href="{% url 'admin:index' %}" class="nav-item {% if request.path == '/admin/' %}active{% endif %}"><i class="fa-solid fa-house"></i> Home</a>
            <a href="{% url 'admin:Tour_classroom_changelist' %}" class="nav-item {% if 'classroom' in request.path %}active{% endif %}"><i class="fa-solid fa-door-open"></i> Rooms</a>
            <a href="{% url 'admin:Tour_tour_changelist' %}" class="nav-item {% if '/tour/' in request.path %}active{% endif %}"><i class="fa-solid fa-map"></i> Tours</a>
            <a href="{% url 'admin:Tour_tourscene_changelist' %}" class="nav-item {% if 'tourscene' in request.path %}active{% endif %}"><i class="fa-solid fa-image"></i> Scenes</a>
            <a href="{% url 'admin:Tour_schoolinfo_changelist' %}" class="nav-item {% if 'schoolinfo' in request.path %}active{% endif %}"><i class="fa-solid fa-circle-info"></i> About</a>
            <a href="/admin/logout/" class="nav-item logout"><i class="fa-solid fa-arrow-left"></i> Exit</a>
        </div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-layout">
        <!-- TOP BAR -->
        <div class="top-bar">
            <div class="logo-left">KCC.</div>
        </div>

        <!-- DJANGO CONTENT INJECTION POINT -->
        <div class="admin-content-wrapper">
            {% block content_main %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
