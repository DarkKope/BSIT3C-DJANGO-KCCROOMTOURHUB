{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content_main %}
<style>
    /* 1. Force hide Django's default cropped title */
    #content > h1:first-child { 
        display: none !important; 
    }

    /* 2. Force the background image to fill the whole area */
    .admin-content-wrapper {
        background: linear-gradient(rgba(10, 31, 68, 0.7), rgba(10, 31, 68, 0.7)), 
                    url('https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        min-height: 100vh !important; 
        padding-left: 120px !important; 
        margin-top: -20px !important; 
    }
</style>

<!-- The Hero Text -->
<div class="hero">
    <h1 style="font-family: 'Oswald', sans-serif !important; font-size: 5.5rem !important; line-height: 1.1 !important; text-transform: uppercase !important; margin-bottom: 20px !important; color: #ffffff !important; text-shadow: 2px 2px 10px rgba(0,0,0,0.5) !important; display: block !important;">
        Step Inside<br><span style="color: #F2A900 !important;">KCC Digital</span><br>Rooms.
    </h1>
    
    <p style="color: #E6F0FA !important; font-size: 1.3rem !important; max-width: 600px !important; line-height: 1.6 !important; font-weight: 300 !important; text-shadow: 1px 1px 4px rgba(0,0,0,0.8) !important; display: block !important;">
        Immerse yourself in our interactive 360° learning environments. Navigate through the halls of Kabankalan Catholic College from the comfort of your screen.
    </p>
</div>
{% endblock %}
