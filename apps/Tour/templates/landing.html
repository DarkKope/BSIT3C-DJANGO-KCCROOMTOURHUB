<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCC Room Tour Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* KCC Color Palette */
            --kcc-blue: #0A1F44; /* Deep Navy Blue */
            --kcc-gold: #F2A900; /* Gold */
            --kcc-light-blue: #E6F0FA; /* Light Blue */
            --text-light: #ffffff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            /* Fullscreen School Background Image */
            background: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Dark overlay to make the text readable */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 31, 68, 0.7); /* Deep blue transparent overlay */
            z-index: 1;
        }

        /* Top Left Logo */
        .top-logo {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--kcc-gold);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Semi-transparent glass card in the center */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 60px 50px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 90%;
            z-index: 10; /* Sit above the background overlay */
            position: relative;
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 3.5rem;
            line-height: 1.1;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .title span {
            color: var(--kcc-gold);
        }

        .subtitle {
            color: var(--kcc-light-blue);
            font-size: 1.1rem;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-enter {
            background-color: var(--kcc-gold);
            color: var(--kcc-blue);
            font-weight: 700;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            border: none;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-enter:hover {
            background-color: #ffffff;
            color: var(--kcc-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Top Left Logo -->
    <div class="top-logo">
        <i class="fa-solid fa-graduation-cap"></i> KCC.
    </div>

    <!-- Center Glass Card -->
    <div class="glass-card">
        <h1 class="title">KCC Room<br><span>Tour Hub</span></h1>
        <p class="subtitle">Step into your virtual 360° learning environment at Kabankalan Catholic College.</p>
        
        <a href="{% url 'dashboard' %}" class="btn-enter">
            Enter Dashboard &rarr;
        </a>
    </div>

</body>
</html>
