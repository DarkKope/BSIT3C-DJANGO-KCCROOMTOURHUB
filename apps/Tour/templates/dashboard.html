<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | KCC Room Tour Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* KCC Color Palette */
            --kcc-blue: #0A1F44; /* Deep Navy Blue */
            --kcc-gold: #F2A900; /* Gold */
            --kcc-light-blue: #E6F0FA; /* Light Blue Background */
            --text-light: #ffffff;
            --text-dark: #333333;
            --accent-red: #FF2A2A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--kcc-blue); 
            color: var(--text-light); 
            display: flex; 
            min-height: 100vh; 
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar { 
            width: 100px; 
            background-color: rgba(10, 31, 68, 0.95); /* Semi-transparent blue */
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px; 
            position: fixed; 
            height: 100vh; 
            z-index: 100; 
        }
        .sidebar-logo { 
            font-size: 1.5rem; 
            color: var(--kcc-gold); /* Gold Logo */
            margin-bottom: 50px; 
            text-align: center;
        }
        .sidebar-menu { list-style: none; width: 100%; padding: 0 10px; }
        .sidebar-menu li { width: 100%; text-align: center; margin-bottom: 15px; }
        .sidebar-btn { 
            background: none; 
            border: none; 
            color: var(--kcc-light-blue); 
            font-size: 1.2rem; 
            cursor: pointer; 
            transition: 0.3s; 
            padding: 15px 5px; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px; 
            text-decoration: none; 
            border-radius: 8px; 
        }
        .sidebar-btn span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .sidebar-btn:hover, .sidebar-btn.active { color: var(--kcc-blue); background-color: var(--kcc-gold); }
        .sidebar-btn.active { border-left: 4px solid var(--kcc-light-blue); }

        /* Main Content - Fullscreen Background */
        .main-content { 
            margin-left: 100px; 
            flex-grow: 1; 
            padding: 40px; 
            max-width: 1400px; 
            /* Fullscreen Background Image */
            background: linear-gradient(rgba(10, 31, 68, 0.8), rgba(10, 31, 68, 0.8)), 
                        url('https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&q=80&w=1920') center/cover no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Header (Removed Nav Links) */
        .header { 
            position: absolute; 
            top: 40px; 
            left: 40px;
        }
        .header .logo { 
            font-family: 'Oswald', sans-serif; 
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--kcc-gold); /* Gold KCC logo */
            letter-spacing: 2px;
        }

        /* Hero Text */
        .hero { max-width: 700px; }
        .hero-title { 
            font-family: 'Oswald', sans-serif; 
            font-size: 5rem; 
            line-height: 1.1; 
            text-transform: uppercase; 
            margin-bottom: 20px; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        .hero-title span { color: var(--kcc-gold); } /* Gold highlight */
        .hero-desc { 
            color: var(--kcc-light-blue); 
            font-size: 1.2rem; 
            max-width: 500px; 
            line-height: 1.6; 
            font-weight: 300;
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <ul class="sidebar-menu">
            <li><a href="{% url 'dashboard' %}" class="sidebar-btn active" title="Home"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
            <li><a href="{% url 'rooms' %}" class="sidebar-btn" title="Rooms"><i class="fa-solid fa-door-open"></i><span>Rooms</span></a></li>
            <li><a href="{% url 'about' %}" class="sidebar-btn" title="About KCC"><i class="fa-solid fa-circle-info"></i><span>About</span></a></li>
            <li style="margin-top: 50px;"><a href="{% url 'landing' %}" class="sidebar-btn text-danger" title="Exit Hub"><i class="fa-solid fa-arrow-left"></i><span>Exit</span></a></li>
        </ul>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- Top Left Logo -->
        <div class="header">
            <div class="logo">KCC.</div>
        </div>

        <!-- Hero Text -->
        <div class="hero">
            <h1 class="hero-title">Step Inside<br><span>KCC Digital</span><br>Rooms.</h1>
            <p class="hero-desc">Immerse yourself in our interactive 360° learning environments. Navigate through the halls of Kabankalan Catholic College from the comfort of your screen.</p>
        </div>
    </div>
</body>
</html>
